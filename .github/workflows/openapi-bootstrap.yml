# TEMPORARY bootstrap: retrieves the pinned backend OpenAPI artifact inside a
# GitHub-hosted runner (which can reach GitHub Actions artifact blob storage),
# verifies its SHA-256, and commits it to this branch. Removed after use.
name: Bootstrap pinned OpenAPI snapshot

on:
  workflow_dispatch:
  push:
    branches: [arena/807bbe3c-edam-frontend]
    paths: [.github/workflows/openapi-bootstrap.yml]

permissions:
  contents: write
  actions: read

jobs:
  fetch-spec:
    name: Fetch and verify backend OpenAPI artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: arena/807bbe3c-edam-frontend

      - name: Download the genuine OpenAPI artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SPEC_NAME: openapi-620f7a795cc67a16e905115131f561bbd986af85
          EXPECTED_SHA: 9533c5a5a9ce3044b2543cabaa7db09952b26c9e8581e08baf9889c33df2843d
        run: |
          set -euo pipefail
          mkdir -p openapi-spec
          echo "::group::Download backend run 44395699755 artifact"
          if ! gh run download 44395699755 \
              --repo Jhamankhatri/edam \
              --name "${SPEC_NAME}" \
              --dir openapi-spec; then
            echo "gh run download failed; falling back to the artifact archive API"
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/Jhamankhatri/edam/actions/artifacts/14472210141/zip" \
              -o /tmp/openapi-artifact.zip
            unzip -o /tmp/openapi-artifact.zip -d openapi-spec
          fi
          echo "::endgroup::"
          echo "::group::Artifact contents"
          ls -l openapi-spec
          sha256sum openapi-spec/*
          echo "::endgroup::"
          echo "${EXPECTED_SHA}  openapi-spec/${SPEC_NAME}.json" | sha256sum -c -
          echo "CHECKSUM VERIFIED: ${EXPECTED_SHA}"

      - name: Commit the verified snapshot
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openapi-spec/
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit"
            exit 0
          fi
          git commit -m "chore: pin verified OpenAPI snapshot for backend 620f7a7"
          git push origin HEAD:arena/807bbe3c-edam-frontend
